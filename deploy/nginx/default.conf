# Core Context
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimization & Security
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Request size limits
    client_max_body_size 10M;

    # Rate Limiting Zone definition (10 req/sec per IP)
    limit_req_zone $http_cf_connecting_ip zone=api_limit:10m rate=10r/s;

    # Upstreams mapping based on analysis
    upstream backend_service {
        server backend:5000;
    }

    server {
        listen 8080;
        server_name _;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # CSP formatted precisely on a single line
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https:; img-src 'self' data: https:;" always;

        # ── Backend Microservice Routing (REST API) ──────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend_service/api/;
            proxy_http_version 1.1;
            
            # Use CF-Connecting-IP if it exists, otherwise fallback to standard Forwarded For
            set $client_ip $http_cf_connecting_ip;
            if ($client_ip = "") {
                set $client_ip $remote_addr;
            }
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── WebSockets Routing (Socket.io) ───────────────────────────────────
        location /socket.io/ {
            proxy_pass http://backend_service/socket.io/;
            proxy_http_version 1.1;
            
            # Required for WebSocket Upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Disable buffering for real-time traffic
            proxy_buffering off;
            proxy_read_timeout 86400; # Keep-alive for long socket sessions
        }

        # ── Frontend SPA Serving (Static Files) ──────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            
            # Cache control for static assets
            location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
                expires 6M;
                access_log off;
                add_header Cache-Control "public, max-age=15552000, immutable";
            }
        }
    }
}
